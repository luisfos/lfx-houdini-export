# Configuration for parameter menu callbacks
# Defines optype-specific settings for versioned path parameters

# Default settings for all optypes (fallback)
[default]
extensions = [".bgeo.sc", ".bgeo", ".abc", ".usd", ".usda", ".usdc", ".vdb", ".obj", ".fbx"]
default_extension = ".bgeo.sc"
time_dependent = true
base_suffix = "/geo"

# ROP Geometry node
["Driver/rop_geometry"]
extensions = [".bgeo", ".bgeo.sc", ".vdb"]
default_extension = ".bgeo.sc"

# Geometry SOP (alias to rop_geometry)
[geometry]
alias = "Driver/rop_geometry"

# ROP Alembic node
["Driver/rop_alembic"]
extensions = [".abc"]
default_extension = ".abc"
time_dependent = false
base_suffix = "/abc"

# Alembic SOP (alias to rop_alembic)
[alembic]
alias = "Driver/rop_alembic"

# Generic Render ROP
[render]
extensions = [".exr", ".jpg", ".png"]
default_extension = ".exr"
base_suffix = "/render"

# Mantra
[ifd] 
alias = "render"

[usdrender_rop]
alias = "render"

[opengl]
alias = "render"
base_suffix = "/flip"

# Octane
[Octane_ROP]
alias = "render"

# USD ROP nodes
["Lop/usd_rop"]
extensions = [".usd", ".usda", ".usdc"]
default_extension = ".usd"



# File SOP
["Sop/file"]
extensions = [".bgeo", ".bgeo.sc", ".abc", ".vdb", ".obj", ".fbx"]
default_extension = ".bgeo.sc"

# File Cache SOP
["Sop/filecache"]
extensions = [".bgeo", ".bgeo.sc", ".vdb"]
default_extension = ".bgeo.sc"

# ROP FBX
["Driver/rop_fbx"]
extensions = [".fbx"]
default_extension = ".fbx"


# COPs
["Cop/rop_image"]
extensions = [".exr", ".jpg", ".png"]
default_extension = ".exr"
base_suffix = "/comp"

["Cop/file"]
alias = "Cop/rop_image"

["Driver/image"]
alias = "Cop/rop_image"

