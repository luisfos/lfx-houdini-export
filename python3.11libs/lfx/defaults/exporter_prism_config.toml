# Configuration for parameter menu callbacks
# Defines optype-specific settings for versioned path parameters

# Default settings for all optypes (fallback)
[default]
extensions = [".bgeo.sc", ".bgeo", ".abc", ".usd", ".usda", ".usdc", ".vdb", ".obj", ".fbx"]
time_dependent = true
default_type = "Product"

# --- SETTING GROUPS ---
# Define reusable, named groups of settings

[groups.render]
default_type = "3dRender"
extensions = [".exr", ".jpg", ".png"]
time_dependent = true

[groups.geo_cache]
default_type = "Product"
extensions = [".bgeo.sc", ".bgeo", ".vdb"]
time_dependent = true

[groups.alembic_cache]
default_type = "Product"
extensions = [".abc"]
time_dependent = false

[groups.usd_cache]
default_type = "Product"
extensions = [".usd", ".usda", ".usdc"]
time_dependent = false


# --- ROP to Group Mapping ---
# Map each ROP to one of the groups defined above.
[rop_settings]
"Lop/usdrender_rop"            = { group = "groups.render", parm = "outputimage" }
"Lop/usd_rop"                   = { group = "groups.usd_cache", parm = "output" }
"Lop/karmarendersettings"   = "groups.render"

"Driver/octane_rop"             = { group = "groups.render", parm = "HO_img_fileName" }
"Driver/octanerendersetup"      = "groups.render"
"Driver/redshift_rop"           = "groups.render"
"Driver/ifd"                    = { group = "groups.render", parm = "vm_picture" }
"Driver/karma"                  = "groups.render"
"Driver/opengl"                 = { group = "groups.render", parm = "picture" }

"Driver/rop_geometry"           = { group = "groups.geo_cache", parm = "sopoutput" }
"Driver/geometry"               = { group = "groups.geo_cache", parm = "sopoutput" }
"Sop/filecache"                 = { group = "groups.geo_cache", parm = "file" }
"Sop/file"                      = { group = "groups.geo_cache", parm = "file" }

"Driver/rop_alembic"            = { group = "groups.alembic_cache", parm = "filename" }
"Driver/alembic"                = { group = "groups.alembic_cache", parm = "filename" }


# --- Overrides for specific ROPs ---
# If a ROP needs a specific setting changed, you can override it here.
[rop_settings."Driver/rop_image"]
group = "groups.render" # Inherits from the render group...
default_type = "2drender" # ...but overrides the default_type.

